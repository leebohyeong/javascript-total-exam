<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>짝 맞추기 게임</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <div class="game">
      <h1>🃏 짝 맞추기 게임</h1>
      <ul class="status">
        <li>시도 <storng class="tries">0</storng>번</li>
        <li>시간 <storng class="time">0</storng>초</li>
        <li>최고기록 <storng class="best">없음</storng></li>
      </ul>
      <div class="board">
        <!-- <button type="button" class="card" data-emoji="🃏">
          <span class="front">?</span>
          <span class="back">🃏</span>
        </button> -->
      </div>
      <p class="message">카드를 눌러 시작하세요</p>
      <button type="button" class="restart">다시하기</button>
    </div>
  </body>
</html>
